[project]
name = "component"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
