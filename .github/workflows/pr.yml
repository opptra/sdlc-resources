name: ci

on:
  pull_request:
  push:
    branches: [main, staging, production]

permissions:
  contents: read

jobs:
  tests:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generator and phase CLI tests
        run: |
          python3 - << 'PY'
          import tests.test_generate as t
          t.test_manifest_ok()
          t.test_apps_script_is_rejected()
          t.test_generate_selects_capabilities()
          t.test_scheduled_jobs_firestore_webhook_and_unmet()
          t.test_align_multi_region_custom_paths_and_product_contract()
          PY
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive
