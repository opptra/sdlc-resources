name: ci

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version installed with uv
        type: string
        default: "3.12"
      working_directory:
        description: Directory that contains pyproject.toml and frontend/
        type: string
        default: "."
      run_tests:
        description: auto runs pytest when backend/tests has test_*.py files. true always runs. false skips.
        type: string
        default: auto

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Lint Python
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/frontend/package-lock.json

      - name: Lint frontend
        working-directory: ${{ inputs.working_directory }}/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Test
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          if [ "$RUN_TESTS" = "false" ]; then
            echo "pytest skipped by run_tests=false"
            exit 0
          fi
          if [ "$RUN_TESTS" = "auto" ] && [ -z "$(find backend/tests -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            echo "pytest skipped; no test_*.py under backend/tests"
            exit 0
          fi
          uv run pytest
