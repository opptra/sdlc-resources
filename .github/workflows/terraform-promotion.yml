name: Terraform promotion

on:
  workflow_call:
    inputs:
      component:
        description: Repo-relative component directory containing infra/
        type: string
        required: true
      manifest:
        description: Repo-relative manifest read by render_tfvars.py
        type: string
        required: true
      staging_bucket:
        type: string
        required: true
      staging_prefix:
        type: string
        required: true
      production_bucket:
        type: string
        required: true
      production_prefix:
        type: string
        required: true
      staging_project:
        type: string
        default: opptra-staging
      artifact_repo:
        type: string
        default: apps-release
      docker_context:
        type: string
        default: ""
      dockerfile:
        type: string
        default: ""
      staging_adoption_image:
        description: Existing staging image for a handoff-only plan and apply
        type: string
        default: ""
      adoption_image:
        description: Exact live image reference for an import-only production run
        type: string
        default: ""
      staging_mode:
        description: auto applies on push, reviewed publishes a plan for explicit apply
        type: string
        default: auto
      reviewed_run:
        description: Successful staging or production recovery plan run ID
        type: string
        default: ""
      migrate:
        description: Optional app script that runs and waits for migrations with RELEASE_IMAGE
        type: string
        default: ""
      pre_apply:
        description: Optional reviewed script run after checks and image build, before the release apply
        type: string
        default: ""
      post_apply:
        description: Optional reviewed smoke test script run after a successful apply
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.action != 'closed'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.component }}/infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: |
          terraform fmt -check -recursive
          terraform init -input=false -backend=false
          terraform validate

  backend:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production')) ||
       (github.event_name == 'pull_request' && github.base_ref == 'production' && github.head_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'closed' ||
         (github.event.pull_request.merged && github.ref == 'refs/heads/production')))
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.select.outputs.bucket }}
      prefix: ${{ steps.select.outputs.prefix }}
    steps:
      - id: select
        env:
          TARGET: ${{ (github.base_ref == 'production' || github.ref == 'refs/heads/production') && 'prod' || 'staging' }}
          STAGING_BUCKET: ${{ inputs.staging_bucket }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          PRODUCTION_BUCKET: ${{ inputs.production_bucket }}
          PRODUCTION_PREFIX: ${{ inputs.production_prefix }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == prod ]]; then
            bucket=$PRODUCTION_BUCKET
            prefix=$PRODUCTION_PREFIX
            input_prefix=production
          else
            bucket=$STAGING_BUCKET
            prefix=$STAGING_PREFIX
            input_prefix=staging
          fi
          if [[ -z "${bucket//[[:space:]]/}" || -z "${prefix//[[:space:]]/}" ]]; then
            echo "Set ${input_prefix}_bucket and ${input_prefix}_prefix in the workflow caller." >&2
            exit 1
          fi
          if [[ "$STAGING_BUCKET/$STAGING_PREFIX" == "$PRODUCTION_BUCKET/$PRODUCTION_PREFIX" ]]; then
            echo 'Staging and production must have separate Terraform state.' >&2
            exit 1
          fi
          printf 'bucket=%s\nprefix=%s\n' "$bucket" "$prefix" >> "$GITHUB_OUTPUT"

  build:
    needs: backend
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging' && inputs.staging_adoption_image == '') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        github.base_ref == 'production' && github.head_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository && inputs.adoption_image == '')
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'production' && 'production-build' || 'staging-build' }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: build
        env:
          COMPONENT: ${{ inputs.component }}
          MANIFEST: ${{ inputs.manifest }}
          TARGET: ${{ github.base_ref == 'production' && 'prod' || 'staging' }}
          STAGING_PROJECT: ${{ inputs.staging_project }}
          ARTIFACT_REPO: ${{ inputs.artifact_repo }}
          BUILD_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse HEAD^{tree})
          python3 scripts/render_tfvars.py --manifest "$MANIFEST" --environment "$TARGET" \
            --staging-project "$STAGING_PROJECT" --artifact-repo "$ARTIFACT_REPO" \
            --sha "$tree" --out "$RUNNER_TEMP/build.tfvars.json"
          image=$(jq -er .image "$RUNNER_TEMP/build.tfvars.json")
          project=$(jq -er .project_id "$RUNNER_TEMP/build.tfvars.json")
          region=$(jq -er .region "$RUNNER_TEMP/build.tfvars.json")
          immutable=$(gcloud artifacts repositories describe "$ARTIFACT_REPO" --project "$project" \
            --location "$region" --format='value(dockerConfig.immutableTags)')
          [[ "${immutable,,}" == true ]] || { echo 'Enable immutable registry tags.' >&2; exit 1; }
          gcloud auth configure-docker "$region-docker.pkg.dev" --quiet
          if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            source_dir=$(mktemp -d "$RUNNER_TEMP/image-source.XXXXXX")
            git archive HEAD | tar -x -C "$source_dir"
            context=$(realpath "$source_dir/${BUILD_CONTEXT:-$COMPONENT}")
            dockerfile=$(realpath "$source_dir/${DOCKERFILE:-$COMPONENT/Dockerfile}")
            [[ "$context" == "$source_dir" || "$context" == "$source_dir/"* ]]
            [[ "$dockerfile" == "$context/"* ]]
            docker build --file "$dockerfile" --tag "$image" "$context"
            # A concurrent build may publish the same immutable tag first.
            docker push "$image" || docker buildx imagetools inspect "$image" >/dev/null
          fi
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"

  terraform:
    needs: [backend, build]
    if: >-
      always() && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.backend.result == 'success'
    runs-on: ubuntu-latest
    environment: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production' &&
          inputs.reviewed_run != '' && 'production-recovery') ||
          (github.event.action == 'closed' && 'production') ||
          (github.base_ref == 'production' || github.ref == 'refs/heads/production') && 'production-plan' ||
          ((github.event_name == 'push' && inputs.staging_mode == 'auto') || github.event.action == 'closed' || (github.event_name == 'workflow_dispatch' && inputs.reviewed_run != '')) && 'staging' || 'staging-plan' }}
    concurrency:
      group: >-
        ${{ (github.event.action == 'closed' || (github.event_name == 'workflow_dispatch' && inputs.reviewed_run != '')) &&
          ((github.base_ref == 'production' || github.ref == 'refs/heads/production') && 'terraform-production' || 'terraform-staging') ||
          (github.event_name == 'push' && inputs.staging_mode == 'auto' && 'terraform-staging') ||
          format('terraform-preview-{0}', github.run_id) }}-${{ inputs.component }}
      cancel-in-progress: false
    env:
      COMPONENT: ${{ inputs.component }}
      MANIFEST: ${{ inputs.manifest }}
      TARGET: ${{ (github.base_ref == 'production' || github.ref == 'refs/heads/production') && 'prod' || 'staging' }}
      APPLY: ${{ ((github.event_name == 'push' && inputs.staging_mode == 'auto') || github.event.action == 'closed' || (github.event_name == 'workflow_dispatch' && inputs.reviewed_run != '')) }}
      BUCKET: ${{ needs.backend.outputs.bucket }}
      PREFIX: ${{ needs.backend.outputs.prefix }}
      STAGING_PROJECT: ${{ inputs.staging_project }}
      ARTIFACT_REPO: ${{ inputs.artifact_repo }}
      STAGING_ADOPTION_IMAGE: ${{ inputs.staging_adoption_image }}
      PRODUCTION_ADOPTION_IMAGE: ${{ inputs.adoption_image }}
      STAGING_MODE: ${{ inputs.staging_mode }}
      REVIEWED_RUN: ${{ inputs.reviewed_run }}
      BUILT_IMAGE: ${{ needs.build.outputs.image }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Resolve release inputs
        id: release
        run: |
          set -euo pipefail
          [[ "$STAGING_MODE" == auto || "$STAGING_MODE" == reviewed ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$TARGET" == prod && "$APPLY" == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
              jq -e 'any(.[]; .state == "approved" and any(.environments[]; .name == "production-recovery"))' >/dev/null || {
                echo 'Production recovery requires reviewer approval on the production-recovery environment.' >&2
                exit 1
              }
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$TARGET" == staging && -z "$REVIEWED_RUN" ]]; then
            echo 'Push to staging for a plan, then dispatch with its reviewed run ID.' >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          for old in plan deploy-staging deploy-production; do
            if [[ -f ".github/workflows/$old.yml" ]]; then
              echo "Retire the old .github/workflows/$old.yml caller before enabling promotion." >&2
              exit 1
            fi
          done
          infra=$(realpath "$COMPONENT/infra")
          manifest=$(realpath "$MANIFEST")
          for path in "$infra" "$manifest"; do
            [[ "$path" == "$GITHUB_WORKSPACE/"* ]] || exit 1
          done
          tree=$(git rev-parse HEAD^{tree})
          key=$(printf '%s' "$COMPONENT" | sha256sum | cut -c1-16)
          adoption_image=$STAGING_ADOPTION_IMAGE
          [[ "$TARGET" != prod ]] || adoption_image=$PRODUCTION_ADOPTION_IMAGE
          mode=release
          if [[ -n "$adoption_image" ]]; then
            mode=adopt
          fi
          artifact="terraform-review-$PR_NUMBER-$key"
          if [[ "$TARGET" == staging ]]; then
            artifact="terraform-staging-$key"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            artifact="terraform-recovery-$key"
          fi
          {
            echo "infra=$infra"
            echo "tree=$tree"
            echo "mode=$mode"
            echo "artifact=$artifact"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"
          python3 scripts/render_tfvars.py --manifest "$manifest" --environment "$TARGET" \
            --staging-project "$STAGING_PROJECT" --artifact-repo "$ARTIFACT_REPO" \
            --sha "$tree" --out "$RUNNER_TEMP/release.tfvars.json" --github-output "$GITHUB_OUTPUT"
          if [[ "$mode" == adopt ]]; then
            jq --arg image "$adoption_image" '.image = $image' "$RUNNER_TEMP/release.tfvars.json" \
              > "$RUNNER_TEMP/adopt.tfvars.json"
            mv "$RUNNER_TEMP/adopt.tfvars.json" "$RUNNER_TEMP/release.tfvars.json"
          fi
      - name: Resolve reviewed image and plan
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          COMPONENT_KEY: ${{ steps.release.outputs.key }}
          TREE: ${{ steps.release.outputs.tree }}
          MODE: ${{ steps.release.outputs.mode }}
          IMAGE_TAG: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          workflow_ref=${GITHUB_WORKFLOW_REF%@*}
          workflow_path=${workflow_ref#"$GITHUB_REPOSITORY/"}
          workflow=${workflow_path##*/}
          review_dir="$RUNNER_TEMP/review"
          image=$BUILT_IMAGE

          if [[ -n "$REVIEWED_RUN" ]]; then
            [[ "$REVIEWED_RUN" =~ ^[0-9]+$ && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            event=push
            branch=staging
            if [[ "$TARGET" == prod ]]; then
              event=workflow_dispatch
              branch=production
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" |
              jq -e --arg path "$workflow_path" --arg event "$event" --arg branch "$branch" --arg sha "$GITHUB_SHA" \
                '.path == $path and .event == $event and .head_branch == $branch and .head_sha == $sha and .conclusion == "success"'
            gh run download "$REVIEWED_RUN" --name "$ARTIFACT" --dir "$review_dir"
          elif [[ "$TARGET" == prod && ( "$APPLY" == true || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | jq -cer --arg sha "$GITHUB_SHA" \
                '[.[] | select(.merge_commit_sha == $sha and .merged_at and .base.ref == "production" and .head.ref == "main")] | first')
              PR_NUMBER=$(jq -er .number <<<"$pr")
              PR_HEAD=$(jq -er .head.sha <<<"$pr")
              PR_MERGED_AT=$(jq -er .merged_at <<<"$pr")
            fi
            run_ids=$(gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f event=pull_request -f status=success -f head_sha="$PR_HEAD" \
              --jq '.workflow_runs[].id')
            for run_id in $run_ids; do
              if gh run download "$run_id" --name "terraform-review-$PR_NUMBER-$COMPONENT_KEY" --dir "$review_dir"; then
                break
              fi
            done
            [[ -f "$review_dir/receipt.json" ]] || {
              echo 'No successful production plan receipt found.' >&2
              exit 1
            }
            plan_ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .updated_at)
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" |
              jq -e --arg head "$PR_HEAD" --arg ready "$plan_ready" --arg merged "$PR_MERGED_AT" '
                add | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
                group_by(.user.id) | map(max_by(.id)) |
                any(.[]; .state == "APPROVED" and .commit_id == $head and
                    .submitted_at >= $ready and .submitted_at <= $merged)
              ' >/dev/null || {
                echo 'The selected production plan needs a PR approval after it completes and before merge.' >&2
                exit 1
              }
          fi

          if [[ -d "$review_dir" ]]; then
            jq -e --arg tree "$TREE" --arg target "$BUCKET/$PREFIX" --arg mode "$MODE" \
              '.tree == $tree and .target == $target and .mode == $mode' "$review_dir/receipt.json" >/dev/null
            image=$(jq -er .image "$review_dir/image.json")
          fi
          tfvars="$RUNNER_TEMP/release.tfvars.json"
          if [[ "$MODE" == release ]]; then
            [[ "$image" == "${IMAGE_TAG%:*}@"* ]]
            [[ "${image##*@}" =~ ^sha256:[a-f0-9]{64}$ ]]
            jq --arg image "$image" '.image = $image' "$tfvars" > "$RUNNER_TEMP/image.tfvars.json"
            mv "$RUNNER_TEMP/image.tfvars.json" "$tfvars"
          elif [[ -n "$image" ]]; then
            [[ "$image" == "$(jq -er .image "$tfvars")" ]]
          fi
          jq '{image}' "$tfvars" > "$RUNNER_TEMP/image.json"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Check formatting and validate
        working-directory: ${{ steps.release.outputs.infra }}
        run: |
          terraform fmt -check -recursive
          terraform init -input=false -backend=false
          terraform validate
      - name: Require environment-specific identity
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT" || {
            echo 'Configure WIF_PROVIDER and WIF_SERVICE_ACCOUNT in the matching GitHub environment.' >&2
            exit 1
          }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Plan and check policy
        working-directory: ${{ steps.release.outputs.infra }}
        env:
          TREE: ${{ steps.release.outputs.tree }}
          MODE: ${{ steps.release.outputs.mode }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=$PREFIX"
          vars=()
          if [[ -f "$TARGET.tfvars" ]]; then
            vars+=("-var-file=$TARGET.tfvars")
          fi
          lock=(-lock-timeout=120s)
          expected=()
          if [[ "$APPLY" == true && ( "$TARGET" == prod || -n "$REVIEWED_RUN" ) ]]; then
            expected=(--expected "$RUNNER_TEMP/review/receipt.json")
          fi
          terraform plan -input=false -no-color "${lock[@]}" "${vars[@]}" \
            -var-file="$RUNNER_TEMP/release.tfvars.json" -out="$RUNNER_TEMP/release.tfplan" \
            > /dev/null
          terraform show -no-color "$RUNNER_TEMP/release.tfplan" > "$RUNNER_TEMP/plan.txt"
          if (( $(wc -c < "$RUNNER_TEMP/plan.txt") > 900000 )); then
            echo 'The plan is too large for the review summary. Split the change into smaller promotions.' >&2
            exit 1
          fi
          {
            echo "### Terraform plan for $TARGET"
            printf 'Candidate image: `%s`\n\n' "$(jq -er .image "$RUNNER_TEMP/image.json")"
            echo '~~~text'
            cat "$RUNNER_TEMP/plan.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          terraform show -json "$RUNNER_TEMP/release.tfplan" > "$RUNNER_TEMP/plan.json"
          python3 "$GITHUB_WORKSPACE/scripts/promotion_receipt.py" "$RUNNER_TEMP/plan.json" \
            --tree "$TREE" --environment "$TARGET" --target "$BUCKET/$PREFIX" --mode "$MODE" \
            --out "$RUNNER_TEMP/receipt.json" "${expected[@]}"
      - uses: actions/upload-artifact@v4
        if: env.APPLY == 'false'
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/image.json
          if-no-files-found: error
      - name: Verify release is current
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          branch=staging
          [[ "$TARGET" != prod ]] || branch=production
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)
          [[ "$current" == "$(git rev-parse HEAD)" ]] || {
            echo "A newer $branch commit exists. Skipping this apply." >&2
            exit 1
          }
      - uses: google-github-actions/setup-gcloud@v2
        if: env.APPLY == 'true' && (inputs.pre_apply != '' || inputs.migrate != '' || inputs.post_apply != '')
      - name: Apply reviewed plan
        if: env.APPLY == 'true'
        working-directory: ${{ steps.release.outputs.infra }}
        env:
          MODE: ${{ steps.release.outputs.mode }}
          PRE_APPLY: ${{ inputs.pre_apply }}
          MIGRATE: ${{ inputs.migrate }}
          POST_APPLY: ${{ inputs.post_apply }}
          AUTH: ${{ steps.release.outputs.auth }}
        run: |
          set -euo pipefail
          run_hook() {
            local hook
            hook=$(realpath "$GITHUB_WORKSPACE/$1")
            [[ "$hook" == "$GITHUB_WORKSPACE/"* ]]
            bash "$hook"
          }
          branch=staging
          [[ "$TARGET" != prod ]] || branch=production
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)
          [[ "$current" == "$(git rev-parse HEAD)" ]]
          export RELEASE_IMAGE
          RELEASE_IMAGE=$(jq -er .image "$RUNNER_TEMP/image.json")
          if [[ "$MODE" == release ]]; then
            if [[ -n "$PRE_APPLY" ]]; then
              run_hook "$PRE_APPLY"
            fi
            if [[ -n "$MIGRATE" ]]; then
              run_hook "$MIGRATE"
            fi
          fi
          terraform apply -input=false -lock-timeout=120s "$RUNNER_TEMP/release.tfplan"
          if [[ -n "$POST_APPLY" ]]; then
            run_hook "$POST_APPLY"
          elif [[ "$AUTH" == public || "$AUTH" == app-login ]]; then
            if uri=$(terraform output -raw uri 2>/dev/null) && [[ -n "$uri" ]]; then
              curl --fail --silent --show-error --retry 3 "${uri%/}/api/health"
            fi
          fi
      - name: Completed staging release
        if: env.APPLY == 'true' && env.TARGET == 'staging' && steps.release.outputs.mode == 'release'
        run: echo 'The staging release and configured checks completed.'
