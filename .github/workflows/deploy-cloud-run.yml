name: deploy-cloud-run

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      wif_provider:
        required: true
        type: string
      wif_service_account:
        required: true
        type: string
      manifest:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      staging_project:
        type: string
        default: opptra-staging

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.working_directory }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STAGING_PROJECT: ${{ inputs.staging_project }}
          SHA: ${{ github.sha }}
          MANIFEST: ${{ inputs.manifest }}
          WIF_PROVIDER: ${{ inputs.wif_provider }}
          WIF_SERVICE_ACCOUNT: ${{ inputs.wif_service_account }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Set the WIF Actions variables. scripts/bind-repo.sh prints them." >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/render_tfvars.py" \
            --manifest "$GITHUB_WORKSPACE/$MANIFEST" \
            --environment "$ENVIRONMENT" \
            --staging-project "$STAGING_PROJECT" \
            --sha "$SHA" \
            --out "$GITHUB_WORKSPACE/${{ inputs.working_directory }}/infra/ci.auto.tfvars.json" \
            --github-output "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.wif_service_account }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Build and push
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          REGION: ${{ steps.manifest.outputs.region }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Apply
        env:
          PROJECT: ${{ steps.manifest.outputs.project_id }}
          NAME: ${{ steps.manifest.outputs.name }}
          AUTH: ${{ steps.manifest.outputs.auth }}
        working-directory: ${{ inputs.working_directory }}/infra
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate" \
            -backend-config="prefix=${NAME}"
          terraform plan -input=false -lock-timeout=120s -var-file=ci.auto.tfvars.json -out=tfplan
          terraform apply -input=false -lock-timeout=120s tfplan
          if terraform output -raw uri >/tmp/uri 2>/dev/null; then
            URL="$(cat /tmp/uri)"
            if [ "$AUTH" = "public" ] || [ "$AUTH" = "app-login" ]; then
              curl --fail --silent --show-error "${URL}/api/health"
            fi
            echo "url=${URL}" >> "$GITHUB_OUTPUT"
          fi
        id: apply
      - name: Comment the staging URL
        if: inputs.environment == 'staging' && steps.apply.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.apply.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --search "$SHA" --state all --json number --jq '.[0].number')"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Staging is up: ${URL}"
          fi
