name: deploy-cloud-run

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      wif_provider:
        required: true
        type: string
      wif_service_account:
        required: true
        type: string
      manifest:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      docker_context:
        description: Repo-relative Docker build context. Empty builds inside working_directory.
        required: false
        type: string
        default: ""
      dockerfile:
        description: Repo-relative Dockerfile. Set it together with docker_context.
        required: false
        type: string
        default: ""
      staging_project:
        type: string
        default: opptra-staging

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.working_directory }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STAGING_PROJECT: ${{ inputs.staging_project }}
          SHA: ${{ github.sha }}
          MANIFEST: ${{ inputs.manifest }}
          WIF_PROVIDER: ${{ inputs.environment == 'prod' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_STAGING }}
          WIF_SERVICE_ACCOUNT: ${{ inputs.environment == 'prod' && vars.WIF_SERVICE_ACCOUNT_PROD || vars.WIF_SERVICE_ACCOUNT_STAGING }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Set the WIF Actions variables. scripts/bind-staging.sh and scripts/bind-production.sh print them." >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/render_tfvars.py" \
            --manifest "$GITHUB_WORKSPACE/$MANIFEST" \
            --environment "$ENVIRONMENT" \
            --staging-project "$STAGING_PROJECT" \
            --sha "$SHA" \
            --out "$GITHUB_WORKSPACE/${{ inputs.working_directory }}/infra/ci.auto.tfvars.json" \
            --github-output "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.environment == 'prod' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_STAGING }}
          service_account: ${{ inputs.environment == 'prod' && vars.WIF_SERVICE_ACCOUNT_PROD || vars.WIF_SERVICE_ACCOUNT_STAGING }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Create secret shells and check the project
        working-directory: ${{ inputs.working_directory }}/infra
        env:
          PROJECT: ${{ steps.manifest.outputs.project_id }}
          NAME: ${{ steps.manifest.outputs.name }}
          REGION: ${{ steps.manifest.outputs.region }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate" \
            -backend-config="prefix=${NAME}"
          if grep -q 'module "secrets"' main.tf; then
            terraform apply -input=false -auto-approve -lock-timeout=120s \
              -var-file=ci.auto.tfvars.json -target=module.secrets
          fi
          python3 "$GITHUB_WORKSPACE/scripts/check_secret_versions.py" \
            --project "$PROJECT" \
            --main-tf main.tf
          python3 "$GITHUB_WORKSPACE/scripts/check_firestore.py" \
            --project "$PROJECT" \
            --region "$REGION" \
            --main-tf main.tf
      - name: Build and push
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          REGION: ${{ steps.manifest.outputs.region }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if [ -n "${DOCKER_CONTEXT}" ] || [ -n "${DOCKERFILE}" ]; then
            case "${DOCKER_CONTEXT}${DOCKERFILE}" in
              *..*) echo "docker_context and dockerfile must stay inside the repo" >&2; exit 1 ;;
            esac
            if [ -z "${DOCKER_CONTEXT}" ] || [ -z "${DOCKERFILE}" ]; then
              echo "Set docker_context and dockerfile together." >&2
              exit 1
            fi
            docker build -f "$GITHUB_WORKSPACE/${DOCKERFILE}" -t "$IMAGE" "$GITHUB_WORKSPACE/${DOCKER_CONTEXT}"
          else
            docker build -t "$IMAGE" .
          fi
          docker push "$IMAGE"
      - name: Apply
        env:
          PROJECT: ${{ steps.manifest.outputs.project_id }}
          NAME: ${{ steps.manifest.outputs.name }}
          REGION: ${{ steps.manifest.outputs.region }}
          AUTH: ${{ steps.manifest.outputs.auth }}
        working-directory: ${{ inputs.working_directory }}/infra
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate" \
            -backend-config="prefix=${NAME}"
          terraform plan -input=false -lock-timeout=120s -var-file=ci.auto.tfvars.json -out=tfplan
          terraform apply -input=false -lock-timeout=120s tfplan
          if grep -q 'module "db"' main.tf && gcloud run jobs describe "${NAME}-migrate" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud run jobs execute "${NAME}-migrate" --region "$REGION" --project "$PROJECT" --wait
          fi
          if terraform output -raw uri >/tmp/uri 2>/dev/null; then
            URL="$(cat /tmp/uri)"
            if [ "$AUTH" = "public" ] || [ "$AUTH" = "app-login" ]; then
              curl --fail --silent --show-error "${URL}/api/health"
            elif [ "$AUTH" = "iap" ]; then
              READY="$(gcloud run services describe "$NAME" --region "$REGION" --project "$PROJECT" --format='value(status.conditions[0].status)' 2>/dev/null || echo '')"
              if [ "$READY" = "False" ]; then
                echo "Cloud Run service ${NAME} failed readiness check." >&2
                exit 1
              fi
              TOKEN="$(gcloud auth print-identity-token 2>/dev/null || echo '')"
              if [ -n "$TOKEN" ]; then
                curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "${URL}/api/health" || true
              fi
            fi
            echo "url=${URL}" >> "$GITHUB_OUTPUT"
          fi
        id: apply
      - name: Comment the staging URL
        if: inputs.environment == 'staging' && steps.apply.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.apply.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --search "$SHA" --state all --json number --jq '.[0].number')"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Staging is up: ${URL}"
          fi
