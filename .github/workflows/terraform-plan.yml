name: terraform-plan

on:
  workflow_call:
    inputs:
      environment:
        description: staging or prod. A pull request into production plans prod. Any other pull request plans staging.
        required: true
        type: string
      wif_provider:
        required: true
        type: string
      wif_service_account:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      manifest:
        description: Path to the component service.yaml from the repo root
        required: true
        type: string
      working_directory:
        description: Component directory that contains infra/
        required: true
        type: string
      staging_project:
        type: string
        default: opptra-staging

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Write Terraform variables
        id: manifest
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STAGING_PROJECT: ${{ inputs.staging_project }}
          SHA: ${{ github.sha }}
          MANIFEST: ${{ inputs.manifest }}
          WIF_PROVIDER: ${{ inputs.environment == 'prod' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_STAGING }}
          WIF_SERVICE_ACCOUNT: ${{ inputs.environment == 'prod' && vars.WIF_SERVICE_ACCOUNT_PROD || vars.WIF_SERVICE_ACCOUNT_STAGING }}
        run: |
          if [ "$ENVIRONMENT" != "staging" ] && [ "$ENVIRONMENT" != "prod" ]; then
            echo "environment must be staging or prod" >&2
            exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Set the WIF Actions variables. scripts/bind-staging.sh and scripts/bind-production.sh print them." >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/render_tfvars.py" \
            --manifest "$GITHUB_WORKSPACE/$MANIFEST" \
            --environment "$ENVIRONMENT" \
            --staging-project "$STAGING_PROJECT" \
            --sha "$SHA" \
            --out "$GITHUB_WORKSPACE/${{ inputs.working_directory }}/infra/ci.auto.tfvars.json" \
            --github-output "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.environment == 'prod' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_STAGING }}
          service_account: ${{ inputs.environment == 'prod' && vars.WIF_SERVICE_ACCOUNT_PROD || vars.WIF_SERVICE_ACCOUNT_STAGING }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Plan
        env:
          PROJECT: ${{ steps.manifest.outputs.project_id }}
          NAME: ${{ steps.manifest.outputs.name }}
        working-directory: ${{ inputs.working_directory }}/infra
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate" \
            -backend-config="prefix=${NAME}"
          terraform plan -input=false -no-color -lock-timeout=120s \
            -var-file=ci.auto.tfvars.json -out=tfplan | tee plan.txt
      - name: Comment the plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ steps.manifest.outputs.project_id }}
        run: |
          if [ -z "$PR" ]; then
            exit 0
          fi
          {
            echo "Terraform plan for ${ENVIRONMENT} (${PROJECT}). This does not change the project."
            echo
            echo '```'
            head -c 50000 "${{ inputs.working_directory }}/infra/plan.txt"
            echo
            echo '```'
          } > /tmp/plan-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/plan-comment.md
