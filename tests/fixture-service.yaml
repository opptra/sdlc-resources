name: example-app
purpose: Example console and nightly job used to check the generator.
prod_project: opptra-applications
region: asia-south1
components:
  - name: console
    archetype: cloud-run-service
    auth: iap
    parts: [ui, api]
  - name: nightly
    archetype: cloud-run-job
    auth: none
    parts: [job]
