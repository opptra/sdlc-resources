name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    uses: opptra/sdlc/.github/workflows/deploy-cloud-run.yml@v1
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      wif_provider: ${{ github.ref_name == 'main' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_STAGING }}
      wif_service_account: ${{ github.ref_name == 'main' && vars.WIF_SERVICE_ACCOUNT_PROD || vars.WIF_SERVICE_ACCOUNT_STAGING }}
