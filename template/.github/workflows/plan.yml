name: plan

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    uses: opptra/sdlc/.github/workflows/terraform-plan.yml@v1
    with:
      environment: ${{ github.base_ref == 'main' && 'prod' || 'staging' }}
      wif_provider: ${{ github.base_ref == 'main' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_STAGING }}
      wif_service_account: ${{ github.base_ref == 'main' && vars.WIF_SERVICE_ACCOUNT_PROD || vars.WIF_SERVICE_ACCOUNT_STAGING }}
      pr_number: ${{ github.event.pull_request.number }}
